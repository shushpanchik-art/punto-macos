name: Punto CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pynput pyobjc-framework-Cocoa pyobjc-framework-Carbon
        pip install pytest pytest-cov pytest-timeout
    
    - name: Run unit tests
      run: |
        pytest tests/test_unit.py -v --timeout=60
    
    - name: Run integration tests
      run: |
        pytest tests/test_integration.py -v --timeout=120
    
    - name: Run quality tests
      run: |
        pytest tests/test_quality.py -v --timeout=120
    
    - name: Run stress tests
      run: |
        pytest tests/test_stress.py -v --timeout=300

  lint:
    name: Code Quality
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install linting tools
      run: |
        pip install flake8
    
    - name: Lint with flake8
      run: |
        flake8 punto.py --count --select=E9,F63,F7,F82 --show-source --statistics

  performance:
    name: Performance Benchmarks
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install pynput pyobjc-framework-Cocoa pyobjc-framework-Carbon
    
    - name: Check conversion speed baseline
      run: |
        python -c "
import time
import sys
sys.path.insert(0, '.')
from punto import convert

iterations = 10000
start = time.time()
for i in range(iterations):
    convert('hello', 'ru')
elapsed = time.time() - start
ops_per_sec = iterations / elapsed

print(f'Performance: {ops_per_sec:.0f} conversions/sec')

if ops_per_sec < 1000:
    print(f'FAIL: Performance too low')
    sys.exit(1)
print('PASS: Performance OK')
"
